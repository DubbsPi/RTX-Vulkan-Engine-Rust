[package]
name = "vulkan-engine-v2"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
log = "0.4"
cgmath = "0.18"
png = "0.17"
pretty_env_logger = "0.5"
thiserror = "1"
tobj = { version = "4", features = ["log"] }
gltf = { version = "1.4", package = "myth-gltf", features = [
    "KHR_materials_transmission",
    "KHR_materials_emissive_strength",
    "KHR_materials_ior",
    "KHR_materials_specular",
    "KHR_materials_clearcoat",
    "KHR_materials_sheen",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vulkanalia = { version = "=0.35.0", features = ["libloading", "provisional", "window"] }
winit = "0.29"
bytemuck = "1.25.2"
indexmap = "2.14.2"
